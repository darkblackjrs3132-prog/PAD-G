services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-padg}
      POSTGRES_USER: ${POSTGRES_USER:-padg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-padg_password}
    ports:
      - "5432:5432"
    volumes:
      - padg_db_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-padg_user} -d ${POSTGRES_DB:-padg}"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-padg}
      POSTGRES_USER: ${POSTGRES_USER:-padg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-padg_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    volumes:
      - ./etl:/app/etl
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  padg_db_data:
